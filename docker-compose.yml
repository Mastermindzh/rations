services:
  rations:
    build: .
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ./data:/data
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
